name: Mobile Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/patch-android-manifest.mjs"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: soma-mobile-builds
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Select Android NDK
        shell: bash
        run: |
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No Android NDK found in $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Initialize Android project
        run: npm run android:init

      - name: Apply Soma mobile permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Build installable debug APK
        run: npm run android:apk

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p mobile-artifacts
          find src-tauri/gen/android -type f -name "*.apk" -print -exec cp {} mobile-artifacts/ \;
          test -n "$(find mobile-artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soma-Android-APK
          path: mobile-artifacts/*.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install CocoaPods
        run: brew install cocoapods || brew upgrade cocoapods || true

      - name: Install dependencies
        run: npm install

      - name: Initialize iOS project
        run: npm run ios:init

      - name: Build iOS simulator app
        run: npx tauri ios build --debug --target aarch64-sim --ci

      - name: Package simulator app
        shell: bash
        run: |
          APP_PATH="$(find src-tauri/gen/apple/build -type d -name "*.app" -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Soma-iOS-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Soma-iOS-Simulator
          path: Soma-iOS-Simulator.zip
          if-no-files-found: error

  ios-ipa:
    name: Signed iOS IPA
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      KEYCHAIN_PASSWORD: soma-ci-keychain

    steps:
      - name: Check Apple signing credentials
        id: signing
        shell: bash
        run: |
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_MOBILE_PROVISION" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured; skipping device IPA build."
          fi

      - name: Checkout
        if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        if: steps.signing.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install CocoaPods
        if: steps.signing.outputs.available == 'true'
        run: brew install cocoapods || brew upgrade cocoapods || true

      - name: Install dependencies
        if: steps.signing.outputs.available == 'true'
        run: npm install

      - name: Import Apple signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/soma-ios-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/soma-signing.keychain-db"

          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          PROFILE_PATH="$RUNNER_TEMP/soma.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_PATH"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

      - name: Initialize iOS project
        if: steps.signing.outputs.available == 'true'
        run: npm run ios:init

      - name: Build signed IPA
        if: steps.signing.outputs.available == 'true'
        run: npx tauri ios build --ci --export-method app-store-connect

      - name: Collect IPA
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p mobile-artifacts
          find src-tauri/gen/apple/build -type f -name "*.ipa" -print -exec cp {} mobile-artifacts/ \;
          test -n "$(find mobile-artifacts -type f -name '*.ipa' -print -quit)"

      - name: Upload IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Soma-iOS-IPA
          path: mobile-artifacts/*.ipa
          if-no-files-found: error
