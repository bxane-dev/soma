[package]
name = "soma"
version = "0.1.0"
description = "Soma desktop application"
authors = ["bxane"]
edition = "2021"

[lib]
name = "soma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"
